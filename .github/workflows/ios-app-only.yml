# Build only the iOS app shell (no disc, no game code, unsigned) on GitHub's
# Mac, so a player without a Mac can combine it with their own disc on their
# own computer (PadMint's --app option, or build.sh --app). The app-only IPA
# holds no game code and is safe to keep as a workflow artifact.
name: iOS app only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-only:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Show the tools
        run: |
          set -e
          echo "Runner: $(sw_vers -productVersion) $(uname -m)"
          ls /Applications | grep -i xcode || true
          xcodebuild -version || true
          cmake --version || true
          ninja --version || true
      - name: Pick the newest Xcode
        run: |
          set -e
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$newest" ]; then
            echo "Using $newest"
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version
      - name: Install CMake and Ninja
        run: |
          set -e
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          cmake --version
          ninja --version
      - name: Build the app only (no disc, no game code, unsigned)
        run: scripts/builder/build.sh --app-only --ipa BlueWake-v0.12.0-drag-look-app-only.ipa
      - name: Check the IPA
        run: |
          set -e
          ls -lh BlueWake-v0.12.0-drag-look-app-only.ipa
          unzip -l BlueWake-v0.12.0-drag-look-app-only.ipa | head -20
          if unzip -l BlueWake-v0.12.0-drag-look-app-only.ipa | grep -q gGZLE01_recomp; then
            echo "ERROR: app-only IPA contains a game module" >&2
            exit 1
          fi
          echo "OK: no game module in the IPA"
      - uses: actions/upload-artifact@v4
        with:
          name: bluewake-app-only
          path: BlueWake-v0.12.0-drag-look-app-only.ipa
          retention-days: 5
